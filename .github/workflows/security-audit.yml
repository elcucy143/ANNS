name: Dependency security audit

on:
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'package-lock.json'
      - 'api/package-lock.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm --prefix api audit --omit=dev
